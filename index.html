<!doctype html>
<html lang="fr" data-theme="sombre">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="YO1tv : télé personnelle construite sur le catalogue vidéo quotidien de La Vigie.">
<title>YO1tv</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-prec" viewBox="0 0 24 24"><path d="M6 5v14M18 6l-9 6 9 6z"/></symbol>
    <symbol id="i-suiv" viewBox="0 0 24 24"><path d="M18 5v14M6 6l9 6-9 6z"/></symbol>
    <symbol id="i-lecture" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></symbol>
    <symbol id="i-aime" viewBox="0 0 24 24"><path d="M7 10v11M15 5.9 14 10h5.8a2 2 0 0 1 1.9 2.6l-2.3 8a2 2 0 0 1-1.9 1.4H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.8a2 2 0 0 0 1.8-1.1L12 2a3.1 3.1 0 0 1 3 3.9Z"/></symbol>
    <symbol id="i-bof" viewBox="0 0 24 24"><path d="M17 14V3M9 18.1 10 14H4.2a2 2 0 0 1-1.9-2.6l2.3-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.8a2 2 0 0 0-1.8 1.1L12 22a3.1 3.1 0 0 1-3-3.9Z"/></symbol>
    <symbol id="i-vu" viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><path d="m8.8 12.2 2.2 2.2 4.2-4.4"/></symbol>
    <symbol id="i-tard" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-humeur" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14.5s1.5 2 4 2 4-2 4-2M9 9.5h.01M15 9.5h.01"/></symbol>
    <symbol id="i-dodo" viewBox="0 0 24 24"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7z"/></symbol>
    <symbol id="i-cc" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10.5 10.2a2.2 2.2 0 1 0 0 3.6M17 10.2a2.2 2.2 0 1 0 0 3.6"/></symbol>
    <symbol id="i-plein" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-yt" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-cat" viewBox="0 0 24 24"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="8" cy="8" r="1.5"/></symbol>
    <symbol id="i-fermer" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-bas" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-haut" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
    <symbol id="i-canal" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="m8 2 4 4 4-4"/></symbol>
    <symbol id="i-source" viewBox="0 0 24 24"><circle cx="12" cy="10" r="2"/><path d="M8.5 6.5a5 5 0 0 0 0 7M15.5 6.5a5 5 0 0 1 0 7M5.6 3.6a9 9 0 0 0 0 12.8M18.4 3.6a9 9 0 0 1 0 12.8M12 12v9"/></symbol>
    <symbol id="i-reglages" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
  </defs>
</svg>

<header class="haut">
  <b class="logo" aria-label="YO1tv"><svg viewBox="0 0 340 240" aria-hidden="true"><defs>
    <linearGradient id="haloEnTete" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1677F0" stop-opacity="0"/><stop offset=".5" stop-color="#1677F0"/><stop offset="1" stop-color="#1677F0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g fill="currentColor">
    <path d="M52 34Q170 26 288 34Q310 36 311 58L313 174Q312 196 290 198Q170 206 50 198Q28 196 29 174L31 58Q32 36 52 34ZM56 49Q44 50 44 62L42 172Q42 183 54 184Q170 191 286 184Q298 183 298 172L296 62Q296 50 284 49Q170 42 56 49Z" fill-rule="evenodd"/>
    <path d="M58 72H85L99 100L113 72H140L112 121V160H86V121Z"/>
    <path d="M187 72a44 44 0 1 1 0 88a44 44 0 1 1 0-88Zm0 24a20 20 0 1 0 0 40a20 20 0 1 0 0-40Z" fill-rule="evenodd"/>
  </g>
  <path d="M240 91L263 72H285V160H259V103L246 110Z" fill="#1677F0"/>
  <path d="M95 204Q170 211 245 204" stroke="url(#haloEnTete)" stroke-width="7" stroke-linecap="round" fill="none"/>
  <ellipse cx="170" cy="224" rx="34" ry="5" fill="#1677F0"/></svg><span>tv</span></b>
  <nav class="seg" aria-label="Mode">
    <button id="mTele" aria-pressed="true">Télé</button><button id="mCarte" aria-pressed="false">À la carte</button>
  </nav>
  <span class="horloge" id="horloge" aria-label="Heure de Paris">--:--</span>
  <button class="rond" id="bReglages" aria-label="Réglages" title="Réglages"><svg><use href="#i-reglages"/></svg></button>
</header>

<div class="ecran" id="ecran">
  <div class="video" id="video">
    <div id="lecteur"></div>
    <button class="allumer" id="allumer" hidden>▶ Allumer</button>
    <div class="annonce" id="annonce" hidden></div>
    <button class="im-poignee" id="imOuvrir" aria-label="Afficher les commandes"><svg><use href="#i-haut"/></svg></button>
  </div>
  <div class="barre-im" id="barreIm">
    <button data-cmd="prec" aria-label="Précédente"><svg><use href="#i-prec"/></svg></button>
    <button data-cmd="pause" aria-label="Lecture ou pause"><svg><use href="#i-pause" id="icoImPause"/></svg></button>
    <button data-cmd="suiv" aria-label="Suivante"><svg><use href="#i-suiv"/></svg></button>
    <div class="im-titre"><b id="imCanal"></b><span id="imTitre"></span></div>
    <button data-cmd="canal" aria-label="Canal suivant"><svg><use href="#i-canal"/></svg></button>
    <button data-cmd="aime" id="imAime" aria-pressed="false" aria-label="J'aime ce contenu"><svg><use href="#i-aime"/></svg></button>
    <button data-cmd="bof" id="imBof" aria-pressed="false" aria-label="Bof pour ce contenu"><svg><use href="#i-bof"/></svg></button>
    <button data-cmd="aimeCh" id="imAimeCh" class="ch" aria-pressed="false" aria-label="J'aime cette chaîne"><svg><use href="#i-aime"/></svg><i>ch.</i></button>
    <button data-cmd="bofCh" id="imBofCh" class="ch" aria-pressed="false" aria-label="Bof pour cette chaîne"><svg><use href="#i-bof"/></svg><i>ch.</i></button>
    <button data-cmd="vu" id="imVu" aria-label="Déjà vu"><svg><use href="#i-vu"/></svg></button>
    <button data-cmd="tard" id="imTard" aria-label="Plus tard"><svg><use href="#i-tard"/></svg></button>
    <button data-cmd="cat" id="imCat" aria-label="Mal classée"><svg><use href="#i-cat"/></svg></button>
    <button data-cmd="source" id="imSource" aria-label="Agir sur la source"><svg><use href="#i-source"/></svg></button>
    <button data-cmd="dodo" aria-label="Dodo"><svg><use href="#i-dodo"/></svg></button>
    <button data-cmd="reduire" aria-label="Replier la barre"><svg><use href="#i-bas"/></svg></button>
    <button data-cmd="sortir" aria-label="Quitter le plein écran"><svg><use href="#i-fermer"/></svg></button>
  </div>
</div>

<section class="infos" id="infos">
  <div class="canaux" id="canaux" role="tablist" aria-label="Canaux"></div>
  <div class="bandeau">
    <div class="surtitre"><span id="surtitre"></span><span class="badges" id="badges"></span></div>
    <h1 id="titre">Chargement…</h1>
    <div class="meta"><button class="lien-chaine" id="chaine" title="Voir les vidéos de cette chaîne"></button><span id="meta"></span></div>
    <div class="progres" aria-hidden="true"><i id="progres"></i></div>
  </div>
  <div class="actions" id="actions">
    <button id="bPrec" aria-label="Précédente"><svg><use href="#i-prec"/></svg><span>Précédente</span></button>
    <button id="bPause" aria-label="Lecture ou pause"><svg><use href="#i-pause" id="icoPause"/></svg><span id="txtPause">Pause</span></button>
    <button id="bSuiv" aria-label="Suivante"><svg><use href="#i-suiv"/></svg><span>Suivante</span></button>
    <button id="bAime" aria-pressed="false" class="vote" title="J'aime ce contenu (cette vidéo, son artiste)"><svg><use href="#i-aime"/></svg><span>J'aime<small>contenu</small></span></button>
    <button id="bAimeCh" aria-pressed="false" class="vote" title="J'aime cette chaîne"><svg><use href="#i-aime"/></svg><span>J'aime<small>chaîne</small></span></button>
    <button id="bBof" aria-pressed="false" class="vote" title="Bof pour ce contenu (cette vidéo, son artiste)"><svg><use href="#i-bof"/></svg><span>Bof<small>contenu</small></span></button>
    <button id="bBofCh" aria-pressed="false" class="vote" title="Bof pour cette chaîne"><svg><use href="#i-bof"/></svg><span>Bof<small>chaîne</small></span></button>
    <button id="bVu" title="Déjà vu : écartée pendant 7 jours, même si la grille la reprogramme"><svg><use href="#i-vu"/></svg><span>Déjà vu</span></button>
    <button id="bTard"><svg><use href="#i-tard"/></svg><span>Plus tard</span></button>
    <button id="bCat"><svg><use href="#i-cat"/></svg><span>Catégorie</span></button>
    <button id="bSource"><svg><use href="#i-source"/></svg><span>Source</span></button>
    <button id="bHumeur"><svg><use href="#i-humeur"/></svg><span id="txtHumeur">Humeur</span></button>
    <button id="bDodo" aria-pressed="false"><svg><use href="#i-dodo"/></svg><span id="txtDodo">Dodo</span></button>
    <button id="bCC" aria-pressed="false"><svg><use href="#i-cc"/></svg><span>Sous-titres</span></button>
    <button id="bPlein" aria-pressed="false"><svg><use href="#i-plein"/></svg><span>Plein écran</span></button>
  </div>
</section>

<main>
  <div class="banniere" id="banniere" hidden></div>
  <section id="vueTele">
    <h2 class="titre-section"><span>Et ensuite</span><button class="petit" id="bGrille">Toute la grille</button></h2>
    <ol class="liste" id="ensuite"></ol>
  </section>

  <section id="vueCarte" hidden>
    <div class="filtres">
      <input type="search" id="recherche" placeholder="Chercher un titre, une chaîne…" aria-label="Chercher" autocomplete="off">
      <div class="puces" id="pucesVue"></div>
      <div class="puces" id="pucesCat"></div>
      <div class="puces" id="pucesFormat"></div>
    </div>
    <p class="note" id="noteCarte"></p>
    <ol class="liste" id="carte"></ol>
    <button class="plus" id="bPlus" hidden>Afficher plus</button>
  </section>
  <footer class="pied-projet">Projet personnel en cours de construction · en cas de besoin : <a id="contact" data-a="akouatik" data-b="gmail.com">contact</a></footer>
</main>

<div class="nuit" id="nuit" hidden><span id="nuitHeure"></span><small>Écran noir : le son continue. Toucher pour rallumer.</small></div>
<div class="alerte-dodo" id="alerteDodo" role="alertdialog" aria-live="assertive" hidden><b id="alerteTxt">🌙 Arrêt dans 5 min</b>
  <span><button type="button" data-plus="15">+15 min</button><button type="button" data-plus="30">+30 min</button><button type="button" data-plus="60">+1 h</button><button type="button" data-plus="0">Arrêter</button></span></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toastTxt"></span><span id="toastAct"></span></div>

<dialog id="dlg"><form method="dialog" class="feuille"><div id="dlgCorps"></div><button class="fermer" value="x">Fermer</button></form></dialog>

<script src="app.js"></script>
</body>
</html>
